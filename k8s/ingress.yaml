apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-identity-ingress
  namespace: enterprise-identity
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-enterprise-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  tls:
    - hosts:
        - profile.corp.enterprise.com
      secretName: enterprise-identity-tls
  rules:
    - host: profile.corp.enterprise.com
      http:
        paths:
          # Backend REST API Routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-management-service
                port:
                  number: 8080
          # Frontend React SPA Routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: profile-portal-service
                port:
                  number: 80

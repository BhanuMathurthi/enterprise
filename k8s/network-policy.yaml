apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-identity-netpol
  namespace: enterprise-identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller to frontend and backend
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    # Allow frontend to communicate with backend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: profile-portal
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS egress to external Identity Provider endpoints
    - to: []
      ports:
        - protocol: TCP
          port: 443

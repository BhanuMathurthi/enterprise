apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-portal-deployment
  namespace: enterprise-identity
  labels:
    app.kubernetes.io/name: profile-portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: identity-migration
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: profile-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profile-portal
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in alpine
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: profile-portal
          image: ghcr.io/enterprise/profile-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: profile-portal-service
  namespace: enterprise-identity
  labels:
    app.kubernetes.io/name: profile-portal
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: profile-portal

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profile-portal-hpa
  namespace: enterprise-identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profile-portal-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: profile-portal-pdb
  namespace: enterprise-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profile-portal

apiVersion: v1
kind: Secret
metadata:
  name: identity-service-secrets
  namespace: enterprise-identity
type: Opaque
stringData:
  # In enterprise deployments, inject via HashiCorp Vault, AWS Secrets Manager, or External Secrets Operator
  IDENTITY_NEW_IDP_API_TOKEN: "enc-vault-ssws-enterprise-admin-token"
  IDENTITY_LEGACY_API_TOKEN: "enc-vault-legacy-shared-token"
  SPRING_DATASOURCE_USERNAME: "usermgmt_db_user"
  SPRING_DATASOURCE_PASSWORD: "enc-vault-db-secure-password"

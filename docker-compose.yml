services:
  # 1. PostgreSQL Relational Database (Port 5432)
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: usermanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanagement"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-net

  # 2. Web-Based Database Management GUI (Adminer - Port 8081)
  db-manager:
    image: adminer:latest
    container_name: enterprise-db-manager
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enterprise-net

  # 3. Spring Boot User Management Service (Port 8080)
  user-management-service:
    build:
      context: ./user-management-service
      dockerfile: Dockerfile
    container_name: user-management-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=usermanagement
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - IDENTITY_PROVIDER_ACTIVE=NEW
      - IDENTITY_PROVIDER_NEW_IDP_MOCK_MODE=true
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enterprise-net

  # 4. React Profile Portal (Port 3000)
  profile-portal:
    build:
      context: ./profile-portal
      dockerfile: Dockerfile
    container_name: profile-portal
    ports:
      - "3000:80"
    depends_on:
      - user-management-service
    networks:
      - enterprise-net

volumes:
  postgres_data:
    driver: local

networks:
  enterprise-net:
    driver: bridge

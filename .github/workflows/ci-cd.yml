name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ==========================================
  # 1. Backend CI (Spring Boot 3.2 / Java 17)
  # ==========================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-management-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Unit & Integration Tests
        run: ./mvnw clean test --batch-mode

      - name: Publish Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: user-management-service/target/surefire-reports/

      - name: Package Production JAR
        run: ./mvnw package -DskipTests --batch-mode

  # ==========================================
  # 2. Frontend CI (React 18 / TypeScript)
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile-portal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: profile-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Vite Build
        run: npm run build

      - name: Archive Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: profile-portal/dist/

  # ==========================================
  # 3. Security Scan & Docker Container Build
  # ==========================================
  container-build-scan:
    name: Docker Build & Vulnerability Scan
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Container Image
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./user-management-service
          file: ./user-management-service/Dockerfile
          load: true
          tags: enterprise-usermgmt-backend:${{ github.sha }}

      # Run Trivy Vulnerability Scanner on Backend Image
      - name: Scan Backend Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-usermgmt-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Build Frontend Nginx Container Image
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./profile-portal
          file: ./profile-portal/Dockerfile
          load: true
          tags: enterprise-profile-portal:${{ github.sha }}

      # Run Trivy Vulnerability Scanner on Frontend Image
      - name: Scan Frontend Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-profile-portal:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # 4. Staging Deployment (Kubernetes)
  # ==========================================
  deploy-staging:
    name: Deploy to Kubernetes (Staging)
    needs: [container-build-scan]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests with Kustomize
        run: |
          kubectl kustomize ./k8s

      - name: Deploy to Kubernetes Cluster (Simulated)
        run: |
          echo "Simulating deployment to K8s staging namespace..."
          echo "Applying manifests: kubectl apply -k ./k8s -n enterprise-identity-staging"
          echo "Verifying deployment rollouts..."
          echo "Deployment rollout check completed successfully."

  # ==========================================
  # 5. Production Deployment Gate (Zero-Downtime)
  # ==========================================
  deploy-production:
    name: Deploy to Kubernetes (Production Gate)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Production Rolling Update Rollout
        run: |
          echo "Executing Zero-Downtime Rolling Update to production cluster..."
          echo "kubectl set image deployment/user-management-deployment backend=ghcr.io/org/backend:${{ github.sha }} -n enterprise-identity"
          echo "kubectl set image deployment/profile-portal-deployment frontend=ghcr.io/org/frontend:${{ github.sha }} -n enterprise-identity"
          echo "kubectl rollout status deployment/user-management-deployment -n enterprise-identity --timeout=180s"
          echo "kubectl rollout status deployment/profile-portal-deployment -n enterprise-identity --timeout=180s"
          echo "Production deployment verified healthy!"
